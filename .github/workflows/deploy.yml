name: Test, Build & Deploy

on:
  push:
    branches: [my-site]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-my-site
  cancel-in-progress: false

env:
  IMAGE: lekequ/next-knowledge-qa-assistant

jobs:
  test:
    if: github.ref == 'refs/heads/my-site'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            deploy_dir=/opt/kqa
            if [ ! -d "$deploy_dir" ] || [ ! -w "$deploy_dir" ] || [ ! -x "$deploy_dir" ]; then
              if [ "$(id -u)" -eq 0 ]; then
                install -d -m 0750 "$deploy_dir"
              elif sudo -n true 2>/dev/null; then
                sudo -n install -d -m 0750 -o "$(id -u)" -g "$(id -g)" "$deploy_dir"
              else
                echo "Cannot write to $deploy_dir. Ask a server administrator to run:"
                echo "sudo install -d -m 0750 -o $(id -un) -g $(id -gn) $deploy_dir"
                exit 1
              fi
            fi
            if [ ! -w "$deploy_dir" ] || [ ! -x "$deploy_dir" ]; then
              echo "Deployment directory is still inaccessible: $deploy_dir"
              exit 1
            fi
            if [ ! -s "$deploy_dir/.env" ] || [ ! -r "$deploy_dir/.env" ]; then
              echo "Create a readable, non-empty $deploy_dir/.env using .env.example before deploying."
              exit 1
            fi
      - name: Upload production compose
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml
          target: /opt/kqa
      - name: Update containers
        uses: appleboy/ssh-action@v1
        env:
          APP_IMAGE: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_IMAGE
          command_timeout: 20m
          script: |
            set -eu
            cd /opt/kqa
            test -s .env
            export APP_IMAGE
            docker compose -f docker-compose.prod.yml config --quiet
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --wait postgres redis milvus
            docker compose -f docker-compose.prod.yml run --rm --no-deps web pnpm db:migrate
            docker compose -f docker-compose.prod.yml up -d --wait
            docker image prune -f
